<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Meu perfil e configurações • Busca Peças</title>
  <meta name="description" content="Seus dados, endereços, notificações e privacidade no Busca Peças.">
 
  <!-- Bibliotecas por CDN com versão fixa (ADR-014) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
 
  <!-- CSS do projeto -->
  <link rel="stylesheet" href="../../css/variaveis.css">
  <link rel="stylesheet" href="../../css/base.css">
  <link rel="stylesheet" href="../../css/componentes.css">
 
  <!-- Componente do cabeçalho e script desta página -->
  <script src="../../js/components/cabecalho.js" defer></script>
  <script src="../../js/pages/conta/perfil.js" defer></script>
</head>
<body class="d-flex flex-column min-vh-100">
 
  <!-- Cabeçalho: preenchido por js/components/cabecalho.js -->
  <header id="cabecalho"></header>
 
  <!-- Página logada • Fluxo D, etapa 06 • BP1-60 • /api/usuarios/me -->
  <main id="conteudo" class="perfil flex-grow-1 py-4">
    <div class="container-fluid px-3 px-lg-4">
 
      <nav aria-label="Você está em">
        <ol class="breadcrumb small mb-3">
          <li class="breadcrumb-item"><a href="../busca/main.html">Início</a></li>
          <li class="breadcrumb-item active" aria-current="page">Meu perfil e configurações</li>
        </ol>
      </nav>
 
      <h1 class="perfil__titulo mb-1">Meu perfil e configurações</h1>
      <p class="perfil__sub mb-4">Seu acesso é o mesmo para comprar e para vender.</p>
 
      <!-- Carregando / erro ao carregar -->
      <div id="perfil-carregando" class="text-center text-secondary py-5" role="status">
        <span class="spinner-border spinner-border-sm me-2" aria-hidden="true"></span>Carregando seu perfil…
      </div>
 
      <div id="perfil-erro" class="perfil-aviso perfil-aviso--erro mb-4" role="alert" hidden>
        <i class="bi bi-exclamation-circle" aria-hidden="true"></i>
        <div>
          <span id="perfil-erro-texto">Não foi possível carregar seu perfil.</span>
          <button type="button" class="perfil-link-botao ms-1" id="botao-tentar-de-novo">Tentar de novo</button>
        </div>
      </div>
 
      <div class="row g-4" id="perfil-conteudo" hidden>
 
        
        <!-- ===================== COLUNA PRINCIPAL ===================== -->
        <div class="col-lg-8">
 
          <!-- Dados pessoais -->
          <section class="perfil-card mb-4" aria-labelledby="titulo-pessoais">
            <h2 id="titulo-pessoais" class="perfil-card__titulo">Dados pessoais</h2>
            <span class="etiqueta" id="etiqueta-conta">Conta ativa</span>
 
            <form id="form-pessoais" novalidate>
              <div class="row g-3 mb-3">
                <div class="col-md-6">
                  <label for="nome" class="form-label">Nome completo</label>
                  <input id="nome" name="nome" type="text" class="form-control" maxlength="150" required
                         autocomplete="name" aria-describedby="erro-nome">
                  <div id="erro-nome" class="invalid-feedback"></div>
                </div>
                <div class="col-md-6">
                  <label for="telefone" class="form-label">Telefone</label>
                  <input id="telefone" name="telefone" type="tel" class="form-control" inputmode="numeric"
                         maxlength="15" placeholder="(00) 00000-0000" autocomplete="tel" aria-describedby="erro-telefone">
                  <div id="erro-telefone" class="invalid-feedback"></div>
                </div>
                <div class="col-12">
                  <label for="email" class="form-label">E-mail</label>
                  <input id="email" name="email" type="email" class="form-control" inputmode="email" maxlength="150"
                         required autocomplete="email" aria-describedby="erro-email">
                  <div id="erro-email" class="invalid-feedback"></div>
                </div>
              </div>
 
              <button type="submit" class="btn btn--verde">
                <span class="spinner-border spinner-border-sm me-1" aria-hidden="true" hidden></span>
                <span class="btn__texto">Salvar dados</span>
              </button>
 
              <div class="perfil-aviso mt-3" id="aviso-pessoais" aria-live="polite" hidden></div>
            </form>
 
            <a href="recuperar-senha.html" class="btn btn--contorno mt-3">Alterar senha</a>
          </section>
 
</body>
</html>
