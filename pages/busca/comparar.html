<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Comparar opções • Busca Peças</title>

  <!-- Bibliotecas por CDN com versão fixa (ADR-014) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <!-- CSS do projeto (os estilos desta tela estão em base.css, seção "COMPARAR OPÇÕES") -->
  <link rel="stylesheet" href="../../css/variaveis.css">
  <link rel="stylesheet" href="../../css/base.css">
  <link rel="stylesheet" href="../../css/componentes.css">
  <style>[x-cloak] { display: none !important; }</style>

  <!-- Componente do cabeçalho -->
  <script src="../../js/components/cabecalho.js" defer></script>
</head>
<body class="d-flex flex-column min-vh-100">

  <!-- Cabeçalho: preenchido por js/components/cabecalho.js -->
  <header id="cabecalho"></header>

  <!-- Página pública • BP1-10 • GET /api/pecas/{id} • Fluxo A, etapa 04 -->
  <main id="conteudo" class="comparar container-fluid px-3 px-lg-4 py-4 flex-grow-1" x-data="compararOpcoes">

    <nav aria-label="Você está aqui">
      <ol class="breadcrumb resultados__trilha">
        <li class="breadcrumb-item"><a href="../../index.html">Início</a></li>
        <li class="breadcrumb-item">
          <a :href="linkResultados" x-text="termoDaBusca || 'Buscar peças'">Buscar peças</a>
        </li>
        <li class="breadcrumb-item active" aria-current="page">Comparar opções</li>
      </ol>
    </nav>

    <h1 class="resultados__titulo">Comparar opções</h1>
    <p class="resultados__resumo">
      <span x-show="!carregando" x-text="resumo"></span>
      <span x-show="carregando" class="placeholder-glow"><span class="placeholder col-5 rounded"></span></span>
    </p>

    <!-- Distâncias a partir da localização do cabeçalho (BP1-7, BP1-10). Frete a combinar (ADR-008, ADR-012) -->
    <div class="resultados__regiao" role="status">
      <i class="bi bi-info-circle" aria-hidden="true"></i>
      <p class="flex-grow-1">
        <template x-if="local">
          <span>Distâncias calculadas a partir de <strong x-text="local.rotulo"></strong>.
            Frete e prazo são confirmados com cada loja.</span>
        </template>
        <template x-if="!local">
          <span><strong>Informe sua localização</strong> para ver a distância até cada loja.
            Frete e prazo são confirmados com cada loja.</span>
        </template>
      </p>
      <button type="button" class="btn btn--contorno resultados__regiao-botao" @click="abrirLocalizacao()"
              x-text="local ? 'Alterar' : 'Informar CEP'">Informar CEP</button>
    </div>

    <!-- Carregando -->
    <div class="comparar-caixa placeholder-glow" x-show="carregando" aria-hidden="true">
      <span class="placeholder col-3 placeholder-lg rounded mb-3"></span>
      <span class="placeholder col-12 rounded mb-2" style="height:44px"></span>
      <span class="placeholder col-12 rounded mb-2" style="height:44px"></span>
      <span class="placeholder col-12 rounded mb-2" style="height:44px"></span>
      <span class="placeholder col-12 rounded" style="height:44px"></span>
    </div>

    <!-- Menos de 2 anúncios: não há o que comparar -->
    <div class="resultados-estado" x-show="!carregando && !erro && !suficiente" x-cloak role="alert">
      <i class="bi bi-layout-split" aria-hidden="true"></i>
      <h2 class="h3" x-text="indisponiveis ? 'Algumas opções não estão mais disponíveis' : 'Escolha pelo menos 2 opções para comparar'"></h2>
      <p>Nos resultados da busca, marque “Comparar” em 2 ou 3 anúncios e clique em “Comparar opções”.</p>
      <a class="btn btn--verde" :href="linkResultados">Voltar aos resultados</a>
    </div>

    <!-- Erro da API -->
    <div class="resultados-estado" x-show="!carregando && erro" x-cloak role="alert">
      <i class="bi bi-exclamation-circle" aria-hidden="true"></i>
      <h2 class="h3" x-text="erro"></h2>
      <button type="button" class="btn btn--contorno" @click="carregar()">Tentar novamente</button>
    </div>

    <template x-if="!carregando && !erro && suficiente">
      <div>
        <!-- Um anúncio saiu do ar, mas ainda sobram 2 ou mais -->
        <p class="comparar__aviso" x-show="indisponiveis" role="status">
          <i class="bi bi-exclamation-triangle" aria-hidden="true"></i>
          <span x-text="`${indisponiveis} ${indisponiveis === 1 ? 'anúncio escolhido não está' : 'anúncios escolhidos não estão'} mais disponível. Comparando os demais.`"></span>
        </p>

        <!-- ===== Lado a lado ===== -->
        <section class="comparar-caixa" aria-labelledby="titulo-lado-a-lado">
          <div class="comparar-caixa__topo">
            <div>
              <h2 id="titulo-lado-a-lado" class="comparar-caixa__titulo">Lado a lado</h2>
              <p class="comparar-caixa__sub">Compare preço, distância e condições antes de adicionar ao carrinho.</p>
            </div>
            <!-- BP1-10, passo 5 -->
            <div class="comparar__ordem">
              <label class="form-label" for="ordenar-colunas">Ordenar por</label>
              <select id="ordenar-colunas" class="form-select" x-model="ordenar">
                <template x-for="o in ORDENACOES" :key="o.valor">
                  <option :value="o.valor" :disabled="Boolean(o.precisaLocal && !local)" :selected="ordenar === o.valor"
                          x-text="o.precisaLocal && !local ? `${o.texto} (informe o CEP)` : o.texto"></option>
                </template>
              </select>
            </div>
          </div>
