<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Resultados da busca • Busca Peças</title>

  <!-- Bibliotecas por CDN com versão fixa (ADR-014) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <!-- CSS do projeto (os estilos desta tela estão em base.css, seção "RESULTADOS DA BUSCA") -->
  <link rel="stylesheet" href="../../css/variaveis.css">
  <link rel="stylesheet" href="../../css/base.css">
  <link rel="stylesheet" href="../../css/componentes.css">
  <style>[x-cloak] { display: none !important; }</style>

  <!-- Componente do cabeçalho -->
  <script src="../../js/components/cabecalho.js" defer></script>
</head>
<body class="d-flex flex-column min-vh-100">

  <!-- Cabeçalho: preenchido por js/components/cabecalho.js -->
  <header id="cabecalho"></header>

  <!-- Página pública • BP1-4, 6, 7, 8, 10, 11, 13, 14, 15, 17 • GET /api/busca • Fluxo A, etapas 02 e 03 -->
  <main id="conteudo" class="resultados container-fluid px-3 px-lg-4 py-4 flex-grow-1" x-data="resultadosBusca">

    <nav aria-label="Você está aqui">
      <ol class="breadcrumb resultados__trilha">
        <li class="breadcrumb-item"><a href="../../index.html">Início</a></li>
        <li class="breadcrumb-item active" aria-current="page" x-text="titulo">Buscar peças</li>
      </ol>
    </nav>

    <h1 class="resultados__titulo" x-text="titulo">Buscar peças</h1>
    <p class="resultados__resumo">
      <span x-show="!carregando && !termoCurto && !erro" x-text="resumo"></span>
      <span x-show="carregando" class="placeholder-glow"><span class="placeholder col-4 rounded"></span></span>
    </p>
    <!-- Avisa o leitor de tela quando a lista muda -->
    <p class="visually-hidden" aria-live="polite" x-text="carregando ? 'Carregando resultados…' : resumo"></p>

    <!-- Região usada para distância (BP1-7, BP1-18). Sem localização, pede o CEP (ADR-012, ADR-013) -->
    <div class="resultados__regiao" role="status">
      <i class="bi bi-info-circle" aria-hidden="true"></i>
      <div class="flex-grow-1">
        <template x-if="local">
          <p><strong>Sua região: <span x-text="local.rotulo"></span></strong><br>
            Ajuste o CEP ou use a localização do aparelho para comparar lojas próximas.</p>
        </template>
        <template x-if="!local">
          <p><strong>Informe sua localização</strong><br>
            Com o CEP ou a localização do aparelho, mostramos a distância até cada loja e liberamos o filtro de distância.</p>
        </template>
      </div>
      <button type="button" class="btn btn--contorno resultados__regiao-botao" @click="abrirLocalizacao()"
              x-text="local ? 'Alterar' : 'Informar CEP'">Informar CEP</button>
    </div>

    <div class="row g-4">

      <!-- ===== Painel de filtros: lateral no desktop, janela deslizante no celular ===== -->
      <div class="col-lg-4 col-xl-3">
        <div class="resultados-filtros__fundo d-lg-none" x-show="painelAberto" x-transition.opacity x-cloak
             @click="fecharPainel()"></div>

        <aside id="painel-filtros" class="resultados-filtros" :class="{ 'resultados-filtros--aberto': painelAberto }"
               aria-labelledby="titulo-filtros" :aria-modal="painelAberto ? 'true' : null" :role="painelAberto ? 'dialog' : null">
          <div class="resultados-filtros__topo">
            <h2 id="titulo-filtros" class="resultados-filtros__titulo">Filtros</h2>
            <button type="button" class="resultados-filtros__limpar" @click="limparFiltros()" :disabled="!chips.length">Limpar</button>
            <button type="button" class="btn-close d-lg-none" aria-label="Fechar filtros" x-ref="fecharPainel" @click="fecharPainel()"></button>
          </div>

          <form class="resultados-filtros__corpo" @submit.prevent="fecharPainel()">

            <!-- BP1-6 -->
            <label class="form-label" for="f-categoria">Categoria</label>
            <select id="f-categoria" class="form-select" x-model="filtros.categoria" @change="aoMudarFiltro('categoria')">
              <option value="">Todas as categorias</option>
              <template x-for="c in categorias" :key="c.idCategoria">
                <optgroup :label="c.nome">
                  <option :value="String(c.idCategoria)" :selected="filtros.categoria == c.idCategoria" x-text="`Tudo em ${c.nome}`"></option>
                  <template x-for="s in c.subcategorias || []" :key="s.idCategoria">
                    <option :value="String(s.idCategoria)" :selected="filtros.categoria == s.idCategoria" x-text="s.nome"></option>
                  </template>
                </optgroup>
              </template>
            </select>

            <!-- BP1-4: veículo (marca → modelo → ano) -->
            <label class="form-label" for="f-marca">Veículo / marca</label>
            <select id="f-marca" class="form-select" x-model="filtros.marca" @change="aoMudarFiltro('marca')">
              <option value="">Todas as marcas</option>
              <template x-for="m in marcas" :key="m">
                <option :value="m" :selected="filtros.marca === m" x-text="m"></option>
              </template>
            </select>

            <label class="form-label" for="f-modelo">Modelo</label>
            <select id="f-modelo" class="form-select" x-model="filtros.modelo" @change="aoMudarFiltro('modelo')" :disabled="!filtros.marca">
              <option value="" x-text="filtros.marca ? 'Todos os modelos' : 'Escolha a marca'">Escolha a marca</option>
              <template x-for="m in modelos" :key="m">
                <option :value="m" :selected="filtros.modelo === m" x-text="m"></option>
              </template>
            </select>

            <label class="form-label" for="f-ano">Ano</label>
            <select id="f-ano" class="form-select" x-model="filtros.ano" @change="aoMudarFiltro('ano')" :disabled="!filtros.modelo">
              <option value="" x-text="filtros.modelo ? 'Todos os anos' : 'Escolha o modelo'">Escolha o modelo</option>
              <template x-for="a in anos" :key="a">
                <option :value="String(a)" :selected="filtros.ano == a" x-text="a"></option>
              </template>
            </select>

            <!-- BP-8 -->
            <label class="form-label" for="f-condicao">Condição</label>
            <select id="f-condicao" class="form-select" x-model="filtros.condicao" @change="aoMudarFiltro('condicao')">
              <option value="">Todas</option>
              <template x-for="o in CONDICOES" :key="o.valor"><option :value="o.valor" x-text="o.texto"></option></template>
            </select>

            <!-- BP1-13 -->
            <label class="form-label" for="f-origem">Origem</label>
            <select id="f-origem" class="form-select" x-model="filtros.origem" @change="aoMudarFiltro('origem')">
              <option value="">Todas</option>
              <template x-for="o in ORIGENS" :key="o.valor"><option :value="o.valor" x-text="o.texto"></option></template>
            </select>

            <!-- BP1-7: a localização é escolhida no painel do cabeçalho -->
            <span class="form-label" id="rotulo-localizacao">Localização</span>
            <button type="button" class="form-select text-start resultados-filtros__local" aria-labelledby="rotulo-localizacao"
                    @click="abrirLocalizacao()">
              <span x-text="local ? local.rotulo : 'Informar CEP ou localização'">Informar CEP ou localização</span>
            </button>

            <label class="form-label" for="f-distancia">Distância</label>
            <select id="f-distancia" class="form-select" x-model="filtros.raioKm" @change="aoMudarFiltro('raioKm')"
                    :disabled="!local" aria-describedby="ajuda-distancia">
              <option value="">Qualquer distância</option>
              <template x-for="o in DISTANCIAS" :key="o.valor"><option :value="o.valor" x-text="o.texto"></option></template>
            </select>
            <p id="ajuda-distancia" class="resultados-filtros__ajuda" x-show="!local">Informe a localização para filtrar por distância.</p>

            <!-- BP1-17 -->
            <label class="form-label" for="f-disponibilidade">Disponibilidade</label>
            <select id="f-disponibilidade" class="form-select" x-model="filtros.prontaEntrega" @change="aoMudarFiltro('prontaEntrega')">
              <option value="">Todas</option>
              <template x-for="o in DISPONIBILIDADES" :key="o.valor"><option :value="o.valor" x-text="o.texto"></option></template>
            </select>

            <label class="form-label" for="f-preco">Preço</label>
            <select id="f-preco" class="form-select" x-model="filtros.preco" @change="aoMudarFiltro('preco')">
              <option value="">Qualquer preço</option>
              <template x-for="o in PRECOS" :key="o.valor"><option :value="o.valor" x-text="o.texto"></option></template>
            </select>

            <!-- BP1-15 -->
            <label class="form-label" for="f-nota">Avaliação da loja</label>
            <select id="f-nota" class="form-select" x-model="filtros.notaMinima" @change="aoMudarFiltro('notaMinima')">
              <option value="">Todas as avaliações</option>
              <template x-for="o in NOTAS" :key="o.valor"><option :value="o.valor" x-text="o.texto"></option></template>
            </select>

            <!-- BP1-14 -->
            <label class="form-label" for="f-pagamento">Forma aceita pela loja</label>
            <select id="f-pagamento" class="form-select" x-model="filtros.formaPagamento" @change="aoMudarFiltro('formaPagamento')"
                    aria-describedby="ajuda-pagamento">
              <option value="">Todas as formas</option>
              <template x-for="o in FORMAS_PAGAMENTO" :key="o.valor"><option :value="o.valor" x-text="o.texto"></option></template>
            </select>
            <p id="ajuda-pagamento" class="resultados-filtros__ajuda">
              Formas de pagamento são informadas pela loja, sem processamento na plataforma.
            </p>

            <!-- No celular: fecha a janela e mostra a lista (no desktop os filtros já aplicam na hora) -->
            <button type="submit" class="btn btn--verde w-100 resultados-filtros__aplicar d-lg-none">
              <span x-text="carregando ? 'Atualizando…' : `Ver ${totalRegistros} ${totalRegistros === 1 ? 'resultado' : 'resultados'}`">Ver resultados</span>
            </button>
          </form>
        </aside>
      </div>

      
</body>
</html>
